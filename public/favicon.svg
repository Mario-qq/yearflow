<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- YearFlow 浏览器标签页图标（透明底）：与 icon.svg 一致的年度进度环 -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b93ea"/>
      <stop offset="0.55" stop-color="#2fbc8c"/>
      <stop offset="1" stop-color="#eb9440"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="42"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ring)" stroke-width="42"
          stroke-linecap="round" stroke-dasharray="680 137" transform="rotate(-90 256 256)"/>
  <circle cx="256" cy="126" r="24" fill="#e05d52"/>
</svg>
