<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- YearFlow 主屏图标（G1 磨砂浅蓝，全出血不透明底）：年度进度环 + 朱红今日点。
       供 iOS 主屏图标与 Android maskable adaptive icon 共用——底铺满整个画布，
       环收在安全区内（距中心 <205px），系统裁切圆角/圆形后不露边角。 -->
  <defs>
    <radialGradient id="bg" cx="0.32" cy="0.26" r="0.95">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.55" stop-color="#e9f0fe"/>
      <stop offset="1" stop-color="#d5e2fa"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a6ee0"/>
      <stop offset="0.55" stop-color="#17a06a"/>
      <stop offset="1" stop-color="#d97a16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="42"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ring)" stroke-width="42"
          stroke-linecap="round" stroke-dasharray="680 137" transform="rotate(-90 256 256)"/>
  <circle cx="256" cy="126" r="24" fill="#d4453a"/>
</svg>
