<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>YearFlow 番茄钟</title>
    <script>
      // 与 index.html 同一份首帧主题脚本、同一个 key：小窗常开，闪白比主窗更刺眼
      (function () {
        try {
          var t = localStorage.getItem('yearflow-theme') || 'system';
          if (t === 'system') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        background: var(--bg-base);
        color: var(--text-primary);
      }
      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/pip-main.tsx"></script>
  </body>
</html>
