<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台 · W0 原型 v2</title>
<style>
/* ── 令牌：照搬 src/styles/tokens.css；--desk-* 为工作台专属（W1 进 src/desk/constants.ts） ── */
:root {
  --bg-base:#f7f7f8; --bg-panel:#ffffff; --bg-subtle:#f0f0f2; --bg-raised:#ffffff;
  --border-subtle:#ececee; --border-default:#dcdcdf; --border-strong:#b9b9bf;
  --text-primary:#1a1a1f; --text-secondary:#55555e; --text-tertiary:#8b8b94; --text-disabled:#b9b9bf;
  --weekend-tint:rgba(20,20,30,.025); --row-hover:rgba(20,20,30,.045);
  --goal-1:#2f6fd0; --goal-2:#d97a16; --goal-3:#0f9d6e; --goal-6:#6d5ce0; --goal-9:#d1568c; --goal-7:#0e97ad;
  --accent:#4a6ee0; --accent-soft:color-mix(in srgb,var(--accent) 11%,transparent);
  --success:#17a06a; --warning:#d9910f; --danger:#d4453a;
  --danger-soft:color-mix(in srgb,var(--danger) 13%,transparent);
  --warning-soft:color-mix(in srgb,var(--warning) 15%,transparent);
  --success-soft:color-mix(in srgb,var(--success) 13%,transparent);
  --text-on-accent:#fff;
  --radius-sm:4px; --radius-md:6px; --radius-lg:10px; --radius-xl:14px;
  --shadow-sm:0 1px 2px rgba(16,16,24,.05),0 1px 1px rgba(16,16,24,.03);
  --shadow-md:0 4px 14px rgba(16,16,24,.08),0 1px 3px rgba(16,16,24,.06);
  --shadow-lg:0 12px 32px rgba(16,16,24,.14),0 2px 8px rgba(16,16,24,.08);
  --font-11:11px; --font-12:12px; --font-13:13px; --font-14:14px; --font-16:16px; --font-20:20px; --font-24:24px;
  --ease:cubic-bezier(.25,1,.5,1);
  --desk-row-h:30px; --desk-gap:8px; --desk-pad:20px;
  color-scheme:light;
}
:root[data-theme='dark'] {
  --bg-base:#101014; --bg-panel:#17171c; --bg-subtle:#1e1e24; --bg-raised:#202027;
  --border-subtle:#24242b; --border-default:#303038; --border-strong:#4a4a55;
  --text-primary:#ededf0; --text-secondary:#a7a7b3; --text-tertiary:#74747f; --text-disabled:#4a4a55;
  --weekend-tint:rgba(235,235,255,.025); --row-hover:rgba(235,235,255,.05);
  --goal-1:#5b93ea; --goal-2:#eb9440; --goal-3:#2fbc8c; --goal-6:#8f80ee; --goal-9:#ea77a2; --goal-7:#34b4c9;
  --accent:#6d8bef; --success:#2cb87f; --warning:#e5a63a; --danger:#e05d52;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 1px 1px rgba(0,0,0,.3);
  --shadow-md:0 4px 14px rgba(0,0,0,.4),0 1px 3px rgba(0,0,0,.3);
  --shadow-lg:0 14px 36px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.35);
  color-scheme:dark;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body {
  background:var(--bg-base); color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei UI','Microsoft YaHei','Noto Sans SC',sans-serif;
  font-size:var(--font-14); line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
.tnum { font-variant-numeric:tabular-nums; }
kbd {
  font-family:inherit; font-size:10px; line-height:16px; min-width:16px; text-align:center; color:var(--text-tertiary);
  border:1px solid var(--border-default); border-bottom-width:2px; border-radius:var(--radius-sm); padding:0 4px; background:var(--bg-panel);
}
.btn {
  height:28px; display:inline-flex; align-items:center; gap:6px; font-size:var(--font-12); color:var(--text-secondary);
  border:1px solid var(--border-default); border-radius:var(--radius-md); background:var(--bg-panel); padding:0 10px; white-space:nowrap;
  transition:border-color .12s var(--ease), color .12s var(--ease), background .12s var(--ease);
}
.btn:hover { color:var(--text-primary); border-color:var(--border-strong); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--text-on-accent); }
.btn.primary:hover { filter:brightness(1.07); }
.btn.soft { background:var(--accent-soft); border-color:transparent; color:var(--accent); font-weight:600; }
.btn.soft:hover { background:color-mix(in srgb,var(--accent) 18%,transparent); }
.btn.ghost { border-color:transparent; background:transparent; }
.btn.ghost:hover { background:var(--row-hover); }

/* ── 顶栏（与现有 App 一致，多一个「工作台」） ── */
header.top { height:48px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 16px; border-bottom:1px solid var(--border-default); background:var(--bg-panel); }
.brand { font-weight:600; font-size:var(--font-16); }
nav.nav { display:flex; gap:4px; }
nav.nav a { font-size:var(--font-13); color:var(--text-secondary); text-decoration:none; padding:4px 10px; border-radius:var(--radius-sm); }
nav.nav a.on { color:var(--accent); background:var(--accent-soft); }
.proto-tag { font-size:var(--font-11); color:var(--text-tertiary); border:1px dashed var(--border-default); border-radius:var(--radius-sm); padding:1px 8px; }
.grow { flex:1; }

/* ── 头部：今天是什么局面 + 这一周进行到哪 ── */
.hero { display:flex; align-items:flex-end; gap:24px; padding:18px var(--desk-pad) 14px; flex-shrink:0; }
.h-day { font-size:var(--font-12); color:var(--text-tertiary); letter-spacing:.04em; }
.h-date { font-size:var(--font-24); font-weight:650; letter-spacing:-.01em; line-height:1.15; }
.h-date small { font-size:var(--font-13); font-weight:400; color:var(--text-tertiary); margin-left:8px; letter-spacing:0; }
.h-say { margin-top:6px; font-size:var(--font-13); color:var(--text-secondary); display:flex; flex-wrap:wrap; gap:4px 14px; }
.h-say > span { display:inline-flex; align-items:center; gap:6px; }
.h-say i { width:6px; height:6px; border-radius:50%; background:var(--c); }
.h-say b { color:var(--text-primary); font-weight:600; }
.h-say button { color:var(--text-primary); font-weight:600; border-bottom:1px dashed var(--border-strong); line-height:1.2; }
.h-say button:hover { color:var(--accent); border-color:var(--accent); }

.stats { margin-left:auto; display:flex; align-items:stretch; background:var(--bg-panel); border:1px solid var(--border-subtle); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); }
.stat { padding:9px 16px; display:flex; flex-direction:column; justify-content:center; gap:3px; min-width:0; }
.stat + .stat { border-left:1px solid var(--border-subtle); }
.stat .k { font-size:var(--font-11); color:var(--text-tertiary); white-space:nowrap; }
.stat .v { font-size:var(--font-16); font-weight:650; white-space:nowrap; display:flex; align-items:center; gap:8px; }
.stat .v small { font-size:var(--font-12); font-weight:400; color:var(--text-tertiary); }
.stat.week { flex-direction:row; align-items:center; gap:12px; }
.spark { display:flex; align-items:flex-end; gap:3px; height:22px; }
.spark span { width:5px; border-radius:2px; background:var(--border-default); }
.spark span.on { background:color-mix(in srgb,var(--accent) 55%,transparent); }
.spark span.today { background:var(--accent); }
.dots { display:flex; gap:4px; }
.dots b { width:8px; height:8px; border-radius:50%; background:var(--border-default); }
.dots b.on { background:var(--accent); }
.ms-line { display:flex; align-items:center; gap:6px; font-size:var(--font-12); color:var(--text-secondary); white-space:nowrap; }
.ms-line i { font-style:normal; color:var(--c); font-size:10px; }
.ms-line em { font-style:normal; font-weight:650; color:var(--text-primary); }
.stat.close { justify-content:center; padding:8px 10px; }

/* ── 工具条：周切换 + 视图 + 待处理 ── */
.bar { display:flex; align-items:center; gap:8px; padding:0 var(--desk-pad) 10px; flex-shrink:0; }
.wk-nav { display:flex; align-items:center; gap:2px; }
.wk-nav .arrow { width:28px; height:28px; border-radius:var(--radius-md); color:var(--text-secondary); font-size:var(--font-16); }
.wk-nav .arrow:hover { background:var(--row-hover); color:var(--text-primary); }
.wk-label { font-size:var(--font-14); font-weight:600; min-width:150px; text-align:center; }
.seg { display:flex; padding:2px; border-radius:var(--radius-md); background:var(--bg-subtle); }
.seg button { height:24px; padding:0 12px; font-size:var(--font-12); color:var(--text-secondary); border-radius:var(--radius-sm); }
.seg button.on { background:var(--bg-panel); color:var(--text-primary); font-weight:600; box-shadow:var(--shadow-sm); }
.badge { min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--accent); color:var(--text-on-accent); font-size:10px; font-weight:700; display:inline-grid; place-items:center; }

/* ── 周历：七张日卡 ── */
.stage { flex:1; min-height:0; position:relative; overflow:hidden; }
.board { position:absolute; inset:0; overflow-y:auto; padding:0 var(--desk-pad) 88px; display:grid; gap:var(--desk-gap); align-items:start; }
.day {
  background:var(--bg-panel); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); min-width:0; min-height:calc(100% - 4px);
  display:flex; flex-direction:column; transition:border-color .12s var(--ease), box-shadow .12s var(--ease), background .12s var(--ease);
}
.day.weekend { background:color-mix(in srgb,var(--bg-panel) 70%,var(--bg-base)); }
.day.today { border-color:color-mix(in srgb,var(--accent) 45%,transparent); box-shadow:0 0 0 3px var(--accent-soft), var(--shadow-sm); }
.day.drop { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel)); }
.dh { padding:10px 12px 0; position:sticky; top:0; z-index:2; background:inherit; border-radius:var(--radius-lg) var(--radius-lg) 0 0; }
.dh-top { display:flex; align-items:baseline; gap:8px; }
.dh-num { font-size:var(--font-20); font-weight:650; line-height:1.1; }
.day.today .dh-num { color:var(--accent); }
.dh-wd { font-size:var(--font-12); color:var(--text-tertiary); }
.day.today .dh-wd { color:var(--accent); font-weight:600; }
.dh-mark { font-size:10px; padding:0 5px; border-radius:3px; }
.dh-mark.off { color:var(--success); background:var(--success-soft); }
.dh-mark.work { color:var(--warning); background:var(--warning-soft); }
.dh-cnt { margin-left:auto; font-size:var(--font-11); color:var(--text-tertiary); }
.dh-menu { width:22px; height:22px; border-radius:var(--radius-sm); color:var(--text-tertiary); opacity:0; margin-right:-4px; }
.day:hover .dh-menu { opacity:1; }
.dh-menu:hover { background:var(--row-hover); color:var(--text-primary); }
.dh-prog { height:2px; border-radius:2px; background:var(--border-subtle); margin:8px 0 0; overflow:hidden; }
.dh-prog i { display:block; height:100%; background:var(--text-tertiary); border-radius:2px; transition:width .3s var(--ease); }
.day.today .dh-prog i { background:var(--accent); }
.day.past .dh-prog i { background:var(--success); }
.db { padding:6px 6px 12px; display:flex; flex-direction:column; }
.day.past .db { opacity:.62; }
.day.past:hover .db { opacity:1; }

.sec { font-size:var(--font-11); color:var(--text-tertiary); padding:10px 8px 3px; display:flex; gap:6px; }
.sec:first-child { padding-top:4px; }
.sec .n { color:var(--text-disabled); }

/* 行 */
.row {
  height:var(--desk-row-h); display:flex; align-items:center; gap:8px; padding:0 8px; border-radius:var(--radius-md);
  font-size:var(--font-13); user-select:none; position:relative;
  transition:opacity .14s var(--ease), transform .14s var(--ease), background .1s var(--ease);
}
.row:hover { background:var(--row-hover); }
.row.sel { background:var(--accent-soft); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 40%,transparent); }
.row.ghosted { opacity:.28; }
.row.dim { opacity:.25; }
.row.lit { background:color-mix(in srgb,var(--accent) 8%,transparent); }
.row.done .t { color:var(--text-tertiary); text-decoration:line-through; text-decoration-color:var(--text-disabled); }
.chk {
  width:15px; height:15px; border-radius:50%; flex-shrink:0; border:1.5px solid var(--border-strong); display:grid; place-items:center;
  transition:background .14s var(--ease), border-color .14s var(--ease), transform .14s var(--ease);
}
.chk:hover { border-color:var(--accent); transform:scale(1.08); }
.row.u1 .chk { border-color:var(--warning); }
.row.u2 .chk { border-color:var(--danger); background:var(--danger-soft); }
.row.done .chk, .chk.on { background:var(--success); border-color:var(--success); }
.row.done .chk::after, .chk.on::after { content:''; width:6px; height:3px; border:1.6px solid #fff; border-top:0; border-right:0; transform:rotate(-45deg) translate(0,-1px); }
.row.routine .chk { border-radius:4px; }
.t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.m { display:flex; gap:6px; align-items:center; flex-shrink:0; font-size:var(--font-11); color:var(--text-tertiary); }
.who { display:inline-flex; align-items:center; gap:4px; height:18px; padding:0 6px 0 2px; border-radius:999px; background:var(--bg-subtle); color:var(--text-secondary); font-size:var(--font-11); }
.who:hover { background:var(--accent-soft); color:var(--accent); }
.who .av { width:14px; height:14px; border-radius:50%; display:grid; place-items:center; font-size:9px; color:#fff; background:var(--c); }
.who .md { color:var(--text-tertiary); }
.m .due { color:var(--warning); }
.m .due.late { color:var(--danger); font-weight:600; }
.m .age { color:var(--warning); }
.m .tm { font-variant-numeric:tabular-nums; }
.m .gd { width:6px; height:6px; border-radius:50%; background:var(--c); }
.nudge { display:none; gap:2px; }
.row.stale:hover .nudge { display:flex; }
.row.stale:hover .age { display:none; }
.nudge button { font-size:var(--font-11); color:var(--text-tertiary); padding:1px 5px; border-radius:4px; }
.nudge button:hover { color:var(--accent); background:var(--accent-soft); }
.row.plan .chk { border-color:var(--c); }
.row.plan.done .chk { background:var(--c); border-color:var(--c); }
.play { font-size:var(--font-11); color:var(--accent); padding:1px 6px; border-radius:4px; opacity:0; }
.row.plan:hover .play { opacity:1; }
.play:hover { background:var(--accent-soft); }
.fold { font-size:var(--font-12); color:var(--text-tertiary); padding:5px 8px; text-align:left; border-radius:var(--radius-md); }
.fold:hover { background:var(--row-hover); color:var(--text-secondary); }
.note { font-size:var(--font-11); color:var(--warning); padding:4px 8px; display:flex; gap:4px; }
.cleared { margin:14px 8px 4px; padding:10px; border-radius:var(--radius-md); text-align:center; font-size:var(--font-12); color:var(--success); background:var(--success-soft); }
.empty-day { font-size:var(--font-12); color:var(--text-disabled); padding:8px; }

/* 学习卡 */
.study {
  margin:2px 2px 6px; padding:12px; border-radius:var(--radius-lg); position:relative; overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 12%,var(--bg-panel)),var(--bg-panel) 70%);
  border:1px solid color-mix(in srgb,var(--c) 35%,transparent);
}
.study::before { content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none; animation:breathe 2.8s var(--ease) infinite alternate; }
@keyframes breathe { from { box-shadow:inset 0 0 0 0 transparent; } to { box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 22%,transparent); } }
.study .top { display:flex; align-items:center; gap:8px; font-size:var(--font-11); color:var(--text-tertiary); }
.study .top .dots { margin-left:auto; }
.study .what { font-size:var(--font-16); font-weight:650; margin:4px 0 2px; }
.study .why { font-size:var(--font-12); color:var(--text-secondary); }
.study .why b { color:var(--warning); font-weight:600; }
.study .acts { display:flex; gap:6px; margin-top:10px; flex-wrap:wrap; }
.study .acts .btn { height:28px; padding:0 10px; }
.study .acts .btn.primary { background:var(--c); border-color:var(--c); }
.study .timer { font-size:28px; font-weight:650; letter-spacing:.01em; margin:2px 0; }
.study-done { display:flex; align-items:center; gap:8px; height:var(--desk-row-h); padding:0 8px; margin-bottom:4px; font-size:var(--font-13); color:var(--text-secondary); }

/* ── 月历 ── */
.month { position:absolute; inset:0; overflow-y:auto; padding:0 var(--desk-pad) 88px; display:none; }
.month.show { display:block; }
.mh { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:var(--desk-gap); padding-bottom:6px; font-size:var(--font-11); color:var(--text-tertiary); }
.mh span { padding-left:10px; }
.mg { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:var(--desk-gap); }
.mc {
  min-height:118px; background:var(--bg-panel); border:1px solid var(--border-subtle); border-radius:var(--radius-lg); padding:8px 6px 6px;
  display:flex; flex-direction:column; gap:1px; min-width:0; transition:border-color .12s var(--ease), background .12s var(--ease);
}
.mc.out { background:transparent; border-style:dashed; }
.mc.out .mc-n { color:var(--text-disabled); }
.mc.weekend:not(.out) { background:color-mix(in srgb,var(--bg-panel) 70%,var(--bg-base)); }
.mc.today { border-color:color-mix(in srgb,var(--accent) 45%,transparent); box-shadow:0 0 0 3px var(--accent-soft); }
.mc.thisweek:not(.today) { border-color:var(--border-default); }
.mc.drop { border-color:var(--accent); background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel)); }
.mc-h { display:flex; align-items:center; gap:6px; padding:0 4px 3px; }
.mc-n { font-size:var(--font-13); font-weight:650; }
.mc.today .mc-n { color:var(--text-on-accent); background:var(--accent); border-radius:999px; padding:0 7px; }
.mc-c { margin-left:auto; font-size:var(--font-11); color:var(--text-tertiary); }
.mc-go { font-size:var(--font-11); color:var(--text-tertiary); opacity:0; padding:0 4px; border-radius:3px; }
.mc:hover .mc-go { opacity:1; }
.mc-go:hover { color:var(--accent); background:var(--accent-soft); }
.mc .row { height:22px; font-size:var(--font-12); gap:6px; padding:0 4px; }
.mc .row .chk { width:11px; height:11px; border-width:1.3px; }
.mc .row .m { display:none; }
.mc-more { font-size:var(--font-11); color:var(--text-tertiary); padding:1px 4px; text-align:left; }

/* ── 悬浮新建（右下角） ── */
.fab {
  position:absolute; right:var(--desk-pad); bottom:18px; z-index:15; height:40px; display:flex; align-items:center; gap:8px; padding:0 12px 0 14px;
  border-radius:999px; background:var(--bg-raised); border:1px solid var(--border-default); box-shadow:var(--shadow-lg);
  font-size:var(--font-13); color:var(--text-secondary); transition:transform .14s var(--ease), color .12s var(--ease);
}
.fab:hover { color:var(--text-primary); transform:translateY(-1px); }
.fab .plus { width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--text-on-accent); display:grid; place-items:center; font-size:15px; line-height:1; }
.qa {
  position:absolute; right:var(--desk-pad); bottom:18px; z-index:16; width:min(460px, calc(100% - 40px));
  background:var(--bg-raised); border:1px solid var(--border-default); border-radius:var(--radius-xl); box-shadow:var(--shadow-lg);
  transform-origin:bottom right; transform:scale(.96) translateY(6px); opacity:0; pointer-events:none;
  transition:transform .16s var(--ease), opacity .12s var(--ease);
}
.qa.show { transform:none; opacity:1; pointer-events:auto; }
.qa input { width:100%; height:46px; border:0; outline:none; background:transparent; color:var(--text-primary); font:inherit; font-size:var(--font-14); padding:0 16px; }
.qa-prev { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 12px; min-height:12px; }
.qa-prev:empty { display:none; }
.chip { display:inline-flex; align-items:center; gap:4px; padding:0 8px; height:22px; border-radius:999px; background:var(--bg-subtle); color:var(--text-secondary); font-size:var(--font-11); }
.chip.k { background:var(--accent-soft); color:var(--accent); font-weight:600; }
.chip.u2 { background:var(--danger-soft); color:var(--danger); }
.chip.u1 { background:var(--warning-soft); color:var(--warning); }
.qa-foot { display:flex; gap:12px; align-items:center; padding:7px 14px; border-top:1px solid var(--border-subtle); font-size:var(--font-11); color:var(--text-tertiary); }

/* ── 挪到…（拖动时 / 选中后浮出的小月历） ── */
.mover {

<script>
'use strict';
/* ═════════════ 日期工具（本地时区） ═════════════ */
const TODAY = '2026-10-16';
const NOW_HOUR = 17; // 原型固定在周五 17 点之后 ⇒ 出现「收尾本周」
const pad = (n) => String(n).padStart(2, '0');
const toD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const add = (s, n) => { const d = toD(s); d.setDate(d.getDate() + n); return fmt(d); };
const dow = (s) => toD(s).getDay();
const mondayOf = (s) => add(s, -((dow(s) + 6) % 7));
const diff = (a, b) => Math.round((toD(a) - toD(b)) / 864e5);
const md = (s) => `${toD(s).getMonth() + 1}/${toD(s).getDate()}`;
const dnum = (s) => toD(s).getDate();
const CN = ['日', '一', '二', '三', '四', '五', '六'];
const isWeekend = (s) => dow(s) === 0 || dow(s) === 6;
const isoWeek = (s) => { const d = toD(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); };
const THIS_MON = mondayOf(TODAY);
const relDay = (d) => { const n = diff(d, TODAY); return n === 0 ? '今天' : n === 1 ? '明天' : n === -1 ? '昨天' : (mondayOf(d) === THIS_MON ? '' : mondayOf(d) === add(THIS_MON, 7) ? '下' : '') + '周' + CN[dow(d)]; };

/* ═════════════ 示例数据 ═════════════ */
const GOALS = { sap: { name: 'SAP', c: 'var(--goal-1)' }, ai: { name: 'AI', c: 'var(--goal-6)' }, en: { name: '英语', c: 'var(--goal-2)' }, py: { name: 'Python', c: 'var(--goal-3)' } };
const PEOPLE_C = ['var(--goal-1)', 'var(--goal-6)', 'var(--goal-3)', 'var(--goal-9)', 'var(--goal-7)', 'var(--goal-2)'];
const avC = (p) => PEOPLE_C[[...p].reduce((a, c) => a + c.charCodeAt(0), 0) % PEOPLE_C.length];
let seq = 100;
const it = (o) => ({ id: 'i' + seq++, kind: 'todo', urgency: 0, scope: 'work', status: 'open', defer: 0, since: o.date || TODAY, ...o });
const D = (n) => add(THIS_MON, n);
const initial = () => ({
  items: [
    it({ title: '整理 MRP 跑批慢的 sqexplain 结论', date: D(0), status: 'done' }),
    it({ title: '回复采购 apmt540 报错原因', date: D(0), status: 'done' }),
    it({ title: '更新 ARM 退货配置检查表', date: D(0), urgency: 1, defer: 3 }),
    it({ kind: 'followup', title: 'MRP 跑批优化进度：已降到 40 分钟', person: '张经理', mode: 'inform', date: D(1), since: D(1) }),
    it({ title: '确认 cmrp810 索引方案', date: D(1), status: 'done' }),

    it({ kind: 'followup', title: 'ARM 测试案例', person: '李工', mode: 'dispatch', date: D(2), status: 'done' }),

    it({ title: '修复出货单过帐失败（客户急单）', date: TODAY, urgency: 2, due: TODAY }),
    it({ title: '汇总周会材料', date: TODAY, urgency: 1, due: TODAY }),
    it({ title: '审 cpmi310 客制改动的代码', date: TODAY }),
    it({ kind: 'followup', title: '下周六晚停机窗口', person: '张经理', mode: 'inform', date: TODAY, since: D(3) }),
    it({ kind: 'followup', title: 'cmrp810 索引脚本', person: '李工', mode: 'dispatch', date: TODAY }),

    it({ kind: 'followup', title: 'Q4 系统需求排期表', person: '陈总', mode: 'dispatch', date: D(8) }),
    it({ title: 'MRP 优化上线评审', date: D(8) }),
    it({ title: '准备 SAP MM 练习数据', date: D(9) }),
    it({ title: '体检', date: D(10), scope: 'life' }),
    it({ title: '季度备份演练', date: D(15) }),
    it({ title: 'Informix 升级方案初稿', date: D(17), urgency: 1 }),
    it({ title: '研究 Informix 统计信息自动更新', date: null }),
    it({ title: '整理 TIPTOP 常见报错知识库', date: null }),
    it({ kind: 'followup', title: '新同事 ERP 权限开通', person: '王芳', mode: 'dispatch', date: null }),
    it({ title: '换一把好用的机械键盘', date: null, scope: 'life' }),
  ],
  routines: [
    { id: 'r1', title: '检查 MRP 夜间批次结果', scope: 'work', rule: { type: 'workday' }, time: '09:00' },
    { id: 'r2', title: '提交上周周报', scope: 'work', rule: { type: 'weekly', days: [1] }, time: '10:00' },

    { id: 'r5', title: '打篮球', scope: 'life', rule: { type: 'weekly', days: [6] } },

    { id: 'r7', title: '月结支持', scope: 'work', rule: { type: 'monthLastWorkday' } },
  ],
  logs: { ...Object.fromEntries([0, 1, 2, 3].map((n) => [`r1:${D(n)}`, { status: 'done' }])), [`r2:${D(0)}`]: { status: 'done' } },
  marks: {},
  plan: [
    { id: 'p1', goal: 'sap', task: 'MM 模块学习', done: false, study: true },
    { id: 'p2', goal: 'en', task: '每日听力 + 口语', done: true },
    { id: 'p3', goal: 'ai', task: 'Agent 实战：项目地图', done: false, study: true },
  ],
  study: { state: 'idle', pick: 0, endAt: 0 },

let S = initial();
let view = 'week';
let anchor = THIS_MON; // 周视图 = 周一；月视图 = 该月任一天
let sel = new Set();
let lastKey = null;
let openFolds = new Set();
let personLit = null;
const undoStack = [];

/* ═════════════ 派生 ═════════════ */
const isWorkday = (d) => { const m = S.marks[d]; if (m) return m === 'work'; return !isWeekend(d); };
function lastWorkdayOfMonth(d) { const x = toD(d); let e = fmt(new Date(x.getFullYear(), x.getMonth() + 1, 0)); while (!isWorkday(e)) e = add(e, -1); return e; }
function ruleHits(r, d) {
  if (r.scope === 'work' && !isWorkday(d)) return false;
  switch (r.rule.type) {
    case 'daily': return true;
    case 'workday': return isWorkday(d);
    case 'weekly': return r.rule.days.includes(dow(d));
    case 'monthDay': return dnum(d) === r.rule.day;
    case 'monthLastWorkday': return lastWorkdayOfMonth(d) === d;
  }
  return false;
}
function routinesOn(d) {
  const out = [];
  for (const r of S.routines) {
    const lg = S.logs[`${r.id}:${d}`];
    if (ruleHits(r, d) && !(lg && lg.status === 'moved')) out.push({ r, orig: d, status: lg?.status });
    for (const [k, v] of Object.entries(S.logs)) if (v.status === 'moved' && v.movedTo === d && k.startsWith(r.id + ':')) out.push({ r, orig: k.split(':')[1], status: v.doneAt ? 'done' : undefined, moved: true });
  }
  if (d === TODAY) {
    for (let x = THIS_MON; x < TODAY; x = add(x, 1)) for (const r of S.routines) {
      if (r.rule.type !== 'weekly' || !ruleHits(r, x)) continue;
      const lg = S.logs[`${r.id}:${x}`];
      if (!lg) out.push({ r, orig: x, makeup: true });
      else if (lg.status === 'done' && lg.makeupOn === TODAY) out.push({ r, orig: x, makeup: true, status: 'done' });
    }
  }
  return out.sort((a, b) => (a.r.time || '99').localeCompare(b.r.time || '99'));
}
const effUrg = (i) => { let u = i.urgency; if (i.due && i.status === 'open') { if (i.due < TODAY) u = 2; else if (diff(i.due, TODAY) <= 1) u = Math.max(u, 1); } return u; };

      const to = target(k);

        const i = findItem(k.slice(2));

        if (to && i.due && to > i.due) late++;

      }
    }

function toggleKey(k, day) {

  const [rid, orig] = k.slice(2).split('@'); const key = `${rid}:${orig}`;

$('todayB').onclick = () => { anchor = view === 'week' ? THIS_MON : TODAY; render(); };
const goToday = () => $('todayB').click();
function step(n) { if (view === 'week') anchor = add(anchor, 7 * n); else { const d = toD(anchor); anchor = fmt(new Date(d.getFullYear(), d.getMonth() + n, 1)); } render(); }

document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { if (typing) return; e.preventDefault(); undo(); return; }
  if (typing) { if (e.target.id === 'qaIn') { if (e.key === 'Enter') submitQA(); if (e.key === 'Escape') closeQA(); } return; }
  const k = e.key;
  if (k === 'Escape') { if (drag) return cancelDrag(); closeMover(); closeQA(); hideMenu(); hidePop(); closeSheet(); $('drawer').classList.remove('show'); sel.clear(); render(); return; }
  if (k === 'n' || k === 'N') { if (!e.shiftKey) { e.preventDefault(); openQA(); } return; }
  if (k === 'i' || k === 'I') { $('drawer').classList.toggle('show'); return; }
  if (k === 't' || k === 'T') { anchor = view === 'week' ? THIS_MON : TODAY; render(); return; }
  if (k === 's' || k === 'S') { if (S.study.state === 'idle') commit('', () => { S.study.state = 'running'; S.study.endAt = Date.now() + 45 * 60e3; }); return; }
  if (e.shiftKey && (k === 'W' || k === 'w')) { if (sel.size) moveKeys([...sel], ...MV.same); return; }
  if (e.shiftKey && (k === 'M' || k === 'm')) { if (sel.size) moveKeys([...sel], ...MV.mon); return; }
  if (e.shiftKey && k === 'ArrowRight' && sel.size) { e.preventDefault(); moveKeys([...sel], ...MV.tomorrow); return; }
  if (k === 'w' || k === 'W') return toWeek();
  if (k === 'm' || k === 'M') return toMonth();
  if (k === 'ArrowLeft') return step(-1);
  if (k === 'ArrowRight') return step(1);
  if ((k === 'x' || k === 'X') && sel.size) { $('selbar').querySelector('[data-act="mv-done"]').click(); return; }
  if ((k === 'd' || k === 'D') && sel.size) { openMover('click', [...sel], $('selbar').querySelector('[data-act="mv-open"]')); return; }
  if (['1', '2', '3'].includes(k) && sel.size) { setUrg({ 1: 2, 2: 1, 3: 0 }[k]); return; }
});

/* ═════════════ 拖拽：3px 起拖 → 浮出「挪到…」小月历；周历/月历/小月历/待处理都能接 ═════════════ */
let drag = null, dragJustEnded = false;
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || e.target.closest('button') || e.shiftKey || e.ctrlKey || e.metaKey) return;
  const row = e.target.closest('.row[data-key]');
  if (!row || row.closest('.pop')) return;
  drag = { key: row.dataset.key, x: e.clientX, y: e.clientY, on: false, row };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 3) return;
    drag.on = true;
    drag.keys = sel.has(drag.key) ? [...sel] : [drag.key];
    document.body.classList.add('dragging');
    document.querySelectorAll('.row[data-key]').forEach((r) => drag.keys.includes(r.dataset.key) && r.classList.add('ghosted'));
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    g.textContent = drag.keys.length > 1 ? `${drag.keys.length} 件` : drag.row.querySelector('.t').textContent;
    document.body.appendChild(g); drag.ghost = g;
    openMover('drag', drag.keys);
  }
  const gw = drag.ghost.offsetWidth; // 靠右时影子放到光标左边，免得盖住小月历
  drag.ghost.style.transform = e.clientX > innerWidth * 0.6 ? `translate(${e.clientX - gw - 14}px, ${e.clientY + 12}px)` : `translate(${e.clientX + 14}px, ${e.clientY + 12}px)`;
  document.querySelectorAll('.drop, .hov').forEach((x) => x.classList.remove('drop', 'hov'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const mvd = el?.closest('[data-mv]'), mvp = el?.closest('[data-mv-pending]'), day = el?.closest('.day[data-day], .mc[data-day]');
  drag.target = undefined;
  let tip = '';
  if (mvd) { mvd.classList.add('hov'); drag.target = mvd.dataset.mv; }
  else if (mvp) { mvp.classList.add('hov'); drag.target = null; tip = '放进待处理'; }
  else if (day && day.dataset.day >= TODAY) { day.classList.add('drop'); drag.target = day.dataset.day; }
  if (drag.target) tip = `${relDay(drag.target)} · ${md(drag.target)}（已排 ${openOn(drag.target)} 件）`;
  const t = $('mvT'); if (t) t.innerHTML = tip ? '→ ' + esc(tip) : '&nbsp;';
});
function endDrag(apply) {
  const d = drag; drag = null;
  if (!d || !d.on) return;
  d.ghost.remove();
  document.body.classList.remove('dragging');
  document.querySelectorAll('.drop, .ghosted, .hov').forEach((x) => x.classList.remove('drop', 'ghosted', 'hov'));
  closeMover();
  dragJustEnded = true; setTimeout(() => (dragJustEnded = false), 0);
  if (!apply || d.target === undefined) return render();
  moveKeys(d.keys, ...toDate(d.target));
}
const cancelDrag = () => endDrag(false);
document.addEventListener('pointerup', () => { if (drag && !drag.on) { drag = null; return; } endDrag(true); });

/* 学习计时（只更新那一个节点） */
let tickTimer;
function tick() {
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    if (S.study.state !== 'running') return clearInterval(tickTimer);
    const el = document.getElementById('timer'); if (!el) return;
    const ms = Math.max(0, S.study.endAt - Date.now());
    el.textContent = `${pad(Math.floor(ms / 60e3))}:${pad(Math.floor((ms % 60e3) / 1e3))}`;
  }, 250);
}

/* 主题 */
const qs = new URLSearchParams(location.search);
let theme = qs.get('theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
function applyTheme() { document.documentElement.dataset.theme = theme; $('themeBtn').textContent = `主题：${theme === 'dark' ? '深色' : '浅色'}`; }
$('themeBtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); };
applyTheme();
if (qs.get('view') === 'month') { view = 'month'; anchor = TODAY; }
render();
</script>
