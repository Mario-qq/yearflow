<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台 · W0 原型</title>
<style>
/* ── 令牌：照搬 src/styles/tokens.css（W1 落地时直接引用原文件） ── */
:root {
  --bg-base:#f7f7f8; --bg-panel:#ffffff; --bg-subtle:#f0f0f2; --bg-raised:#ffffff;
  --border-subtle:#ececee; --border-default:#dcdcdf; --border-strong:#b9b9bf;
  --text-primary:#1a1a1f; --text-secondary:#55555e; --text-tertiary:#8b8b94; --text-disabled:#b9b9bf;
  --weekend-tint:rgba(20,20,30,.03); --row-hover:rgba(20,20,30,.04);
  --goal-1:#2f6fd0; --goal-2:#d97a16; --goal-3:#0f9d6e; --goal-6:#6d5ce0;
  --accent:#4a6ee0; --accent-soft:color-mix(in srgb,var(--accent) 12%,transparent);
  --success:#17a06a; --warning:#d9910f; --danger:#d4453a;
  --danger-soft:color-mix(in srgb,var(--danger) 15%,transparent);
  --warning-soft:color-mix(in srgb,var(--warning) 16%,transparent);
  --text-on-accent:#fff;
  --radius-sm:4px; --radius-md:6px; --radius-lg:10px;
  --shadow-sm:0 1px 2px rgba(16,16,24,.06),0 1px 1px rgba(16,16,24,.04);
  --shadow-lg:0 8px 24px rgba(16,16,24,.12),0 2px 6px rgba(16,16,24,.08);
  --font-11:11px; --font-12:12px; --font-13:13px; --font-14:14px; --font-16:16px; --font-20:20px;
  --ease:cubic-bezier(.25,1,.5,1);
  /* 工作台专属尺寸（W1 进 src/desk/constants.ts） */
  --desk-row-h:28px; --desk-rail-w:300px; --desk-next-w:40px; --desk-next-open:136px;
  color-scheme:light;
}
:root[data-theme='dark'] {
  --bg-base:#101014; --bg-panel:#17171c; --bg-subtle:#1e1e24; --bg-raised:#202027;
  --border-subtle:#24242b; --border-default:#303038; --border-strong:#4a4a55;
  --text-primary:#ededf0; --text-secondary:#a7a7b3; --text-tertiary:#74747f; --text-disabled:#4a4a55;
  --weekend-tint:rgba(235,235,255,.035); --row-hover:rgba(235,235,255,.05);
  --goal-1:#5b93ea; --goal-2:#eb9440; --goal-3:#2fbc8c; --goal-6:#8f80ee;
  --accent:#6d8bef; --success:#2cb87f; --warning:#e5a63a; --danger:#e05d52;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 1px 1px rgba(0,0,0,.3);
  --shadow-lg:0 8px 24px rgba(0,0,0,.5),0 2px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body {
  background:var(--bg-base); color:var(--text-primary);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei UI','Microsoft YaHei','Noto Sans SC',sans-serif;
  font-size:var(--font-14); line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; overflow:hidden;
}
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
.tnum { font-variant-numeric:tabular-nums; }
.btn {
  font-size:var(--font-12); color:var(--text-secondary); border:1px solid var(--border-default);
  border-radius:var(--radius-sm); background:var(--bg-panel); padding:3px 10px; white-space:nowrap;
}
.btn:hover { color:var(--text-primary); border-color:var(--border-strong); }
.btn.primary { background:var(--accent); border-color:var(--accent); color:var(--text-on-accent); }
.btn.primary:hover { filter:brightness(1.06); color:var(--text-on-accent); }

/* ── 顶栏（与现有 App 顶栏一致，多一个「工作台」） ── */
header.top {
  height:48px; flex-shrink:0; display:flex; align-items:center; gap:16px; padding:0 16px;
  border-bottom:1px solid var(--border-default); background:var(--bg-panel);
}
.brand { font-weight:600; font-size:var(--font-16); }
nav.nav { display:flex; gap:4px; }
nav.nav a {
  font-size:var(--font-13); color:var(--text-secondary); text-decoration:none; padding:4px 10px; border-radius:var(--radius-sm);
}
nav.nav a.on { color:var(--accent); background:var(--accent-soft); }
.proto-tag { font-size:var(--font-11); color:var(--text-tertiary); border:1px dashed var(--border-default); border-radius:var(--radius-sm); padding:1px 8px; }
.grow { flex:1; }

/* ── 今日脉搏 ── */
.pulse {
  display:flex; align-items:center; gap:16px; padding:10px 16px 8px; flex-shrink:0;
}
.pulse .date { font-size:var(--font-16); font-weight:600; white-space:nowrap; }
.pulse .date small { font-size:var(--font-12); color:var(--text-tertiary); font-weight:400; margin-left:6px; }
.pulse .say { font-size:var(--font-13); color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.pulse .say b { color:var(--text-primary); font-weight:600; }
.pulse .say b.hot { color:var(--danger); }
.ms { display:flex; gap:8px; margin-left:auto; flex-shrink:0; }
.ms span {
  font-size:var(--font-12); color:var(--text-secondary); padding:2px 8px; border-radius:999px;
  border:1px solid var(--border-default); background:var(--bg-panel); white-space:nowrap;
}
.ms i { font-style:normal; color:var(--c); margin-right:4px; }
.ms em { font-style:normal; color:var(--text-primary); font-weight:600; margin-left:4px; }

/* ── 快速添加 ── */
.qa { padding:0 16px 8px; flex-shrink:0; display:flex; gap:12px; align-items:flex-start; }
.qa-box { flex:1; position:relative; }
.qa input {
  width:100%; height:34px; border:1px solid var(--border-default); border-radius:var(--radius-md);
  background:var(--bg-panel); color:var(--text-primary); font:inherit; font-size:var(--font-13); padding:0 12px 0 32px; outline:none;
}
.qa input:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
.qa .plus { position:absolute; left:11px; top:7px; color:var(--text-tertiary); font-size:var(--font-14); }
.qa .kbd { position:absolute; right:9px; top:8px; }
kbd {
  font-family:inherit; font-size:var(--font-11); color:var(--text-tertiary); border:1px solid var(--border-default);
  border-bottom-width:2px; border-radius:var(--radius-sm); padding:0 5px; background:var(--bg-panel);
}
.qa-preview { display:flex; flex-wrap:wrap; gap:6px; min-height:22px; padding-top:6px; font-size:var(--font-12); color:var(--text-tertiary); }
.chip { display:inline-flex; align-items:center; gap:4px; padding:0 8px; height:20px; border-radius:999px; background:var(--bg-subtle); color:var(--text-secondary); font-size:var(--font-11); }
.chip.k { background:var(--accent-soft); color:var(--accent); }
.chip.u2 { background:var(--danger-soft); color:var(--danger); }
.chip.u1 { background:var(--warning-soft); color:var(--warning); }

/* ── 本周收尾条 ── */
.closing {
  margin:0 16px 8px; padding:7px 12px; border-radius:var(--radius-md); flex-shrink:0;
  background:var(--bg-panel); border:1px solid var(--border-default);
  display:flex; align-items:center; gap:12px; font-size:var(--font-12); color:var(--text-secondary);
}
.closing b { color:var(--text-primary); }
.closing .lead { color:var(--accent); font-weight:600; }

/* ── 主区：周历 + 下周窄列 + 右栏 ── */
.main { flex:1; min-height:0; display:flex; border-top:1px solid var(--border-default); }
.week { flex:1; min-width:0; display:flex; flex-direction:column; }
.week-nav { display:flex; align-items:center; gap:8px; padding:6px 12px; border-bottom:1px solid var(--border-subtle); font-size:var(--font-12); color:var(--text-secondary); }
.week-nav .arrow { width:24px; height:22px; border-radius:var(--radius-sm); color:var(--text-secondary); }
.week-nav .arrow:hover, .week-nav .arrow.hot { background:var(--accent-soft); color:var(--accent); }
.week-nav .label { font-weight:600; color:var(--text-primary); }
.cols { flex:1; min-height:0; display:grid; overflow-y:auto; overflow-x:hidden; align-items:stretch; }
.col { border-right:1px solid var(--border-subtle); min-width:0; display:flex; flex-direction:column; transition:background .12s var(--ease); }
.col.weekend { background:var(--weekend-tint); }
.col.past { }
.col.today { background:color-mix(in srgb,var(--accent) 4%,var(--bg-panel)); box-shadow:inset 0 2px 0 var(--accent); }
.col.drop { background:var(--accent-soft); }
.col.off .ch-day::after { content:'休'; margin-left:6px; font-size:var(--font-11); color:var(--success); }
.col.work .ch-day::after { content:'班'; margin-left:6px; font-size:var(--font-11); color:var(--warning); }
.ch {
  position:sticky; top:0; z-index:2; height:40px; flex-shrink:0; display:flex; align-items:center; gap:6px; padding:0 8px 0 10px;
  background:inherit; backdrop-filter:blur(6px); border-bottom:1px solid var(--border-subtle);
}
.col:not(.today):not(.weekend) .ch { background:var(--bg-base); }
.col.weekend .ch { background:color-mix(in srgb,var(--bg-base) 97%,var(--text-primary)); }
:root[data-theme='dark'] .col.weekend .ch { background:color-mix(in srgb,var(--bg-base) 96.5%,#fff); }
.col.today .ch { background:color-mix(in srgb,var(--accent) 6%,var(--bg-panel)); }
.ch-day { font-size:var(--font-13); font-weight:600; white-space:nowrap; }
.ch-date { font-size:var(--font-12); color:var(--text-tertiary); }
.col.today .ch-date { color:var(--text-on-accent); background:var(--accent); border-radius:999px; padding:0 7px; }
.ch-count { margin-left:auto; font-size:var(--font-11); color:var(--text-tertiary); white-space:nowrap; }
.ch-menu { width:20px; height:20px; border-radius:var(--radius-sm); color:var(--text-tertiary); opacity:0; }
.col:hover .ch-menu { opacity:1; }
.ch-menu:hover { background:var(--row-hover); color:var(--text-primary); }
.cb { padding:6px 6px 24px; display:flex; flex-direction:column; gap:2px; }
.col.past .cb { opacity:.75; }

.sec { font-size:var(--font-11); color:var(--text-tertiary); padding:8px 6px 2px; display:flex; gap:6px; align-items:center; letter-spacing:.02em; }
.sec:first-child { padding-top:2px; }
.sec .n { color:var(--text-disabled); }

/* 行 */
.row {
  height:var(--desk-row-h); display:flex; align-items:center; gap:7px; padding:0 6px; border-radius:var(--radius-sm);
  font-size:var(--font-13); position:relative; user-select:none; cursor:default;
  transition:opacity .14s var(--ease), transform .14s var(--ease);
}
.row:hover { background:var(--row-hover); }
.row.sel { background:var(--accent-soft); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 45%,transparent); }
.row.leaving { opacity:0; transform:translateX(6px); }
.row.ghosted { opacity:.3; }
.row.done .t { color:var(--text-tertiary); text-decoration:line-through; text-decoration-color:var(--text-disabled); }
.chk {
  width:14px; height:14px; border-radius:50%; flex-shrink:0; border:1.5px solid var(--border-strong);
  display:grid; place-items:center; transition:background .14s var(--ease), border-color .14s var(--ease);
}
.chk:hover { border-color:var(--accent); }
.row.u1 .chk { border-color:var(--warning); }
.row.u2 .chk { border-color:var(--danger); background:var(--danger-soft); }
.row.done .chk { background:var(--success); border-color:var(--success); }
.row.done .chk::after { content:''; width:6px; height:3px; border:1.5px solid #fff; border-top:0; border-right:0; transform:rotate(-45deg) translate(0,-1px); }
.row.routine .chk { border-radius:3px; }
.t { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.m { display:flex; gap:4px; align-items:center; flex-shrink:0; font-size:var(--font-11); color:var(--text-tertiary); }
.m .who { color:var(--accent); }
.m .due { color:var(--warning); }
.m .due.late { color:var(--danger); }
.m .age { color:var(--warning); }
.m .gdot { width:6px; height:6px; border-radius:50%; background:var(--c); }
.m .tm { color:var(--text-tertiary); }
.m .mv { color:var(--text-tertiary); }
.nudge { display:none; gap:2px; }
.row.stale:hover .nudge { display:flex; }
.row.stale:hover .age { display:none; }
.nudge button { font-size:var(--font-11); color:var(--text-tertiary); padding:0 3px; border-radius:3px; }
.nudge button:hover { color:var(--accent); background:var(--accent-soft); }

.fold { font-size:var(--font-12); color:var(--text-tertiary); padding:4px 6px; text-align:left; border-radius:var(--radius-sm); }
.fold:hover { background:var(--row-hover); color:var(--text-secondary); }
.rolled-note { font-size:var(--font-11); color:var(--warning); padding:2px 6px; }
.cleared { font-size:var(--font-12); color:var(--success); padding:10px 6px 0; text-align:center; }

/* 年度计划行 */
.row.plan .chk { border-color:var(--c); }
.row.plan.done .chk { background:var(--c); border-color:var(--c); }
.row.plan .play { font-size:var(--font-11); color:var(--text-tertiary); padding:0 4px; border-radius:3px; opacity:0; }
.row.plan:hover .play { opacity:1; }
.row.plan .play:hover { color:var(--accent); background:var(--accent-soft); }

/* 学习卡 */
.study {
  margin:2px 0 4px; padding:10px 10px 9px; border-radius:var(--radius-md); background:var(--bg-panel);
  border:1px solid color-mix(in srgb,var(--accent) 55%,transparent); box-shadow:var(--shadow-sm);
  animation:breathe 2.6s var(--ease) infinite alternate;
}
@keyframes breathe { from { box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent),var(--shadow-sm); } to { box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent),var(--shadow-sm); } }
.study .anchor { font-size:var(--font-11); color:var(--text-tertiary); display:flex; gap:8px; }
.study .anchor span:first-child { flex:1; min-width:0; }
.study .what { font-size:var(--font-14); font-weight:600; margin:2px 0 1px; display:flex; align-items:center; gap:6px; }
.study .what i { width:8px; height:8px; border-radius:2px; background:var(--goal-1); }
.study .why { font-size:var(--font-11); color:var(--text-secondary); }
.study .acts { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; align-items:center; }
.study .acts .btn { padding:3px 8px; }
.study .wk { margin-left:0; display:flex; gap:3px; align-items:center; font-size:var(--font-11); color:var(--text-tertiary); white-space:nowrap; }
.study .wk b { width:7px; height:7px; border-radius:50%; background:var(--border-default); }
.study .wk b.on { background:var(--accent); }
.study .timer { font-size:var(--font-20); font-weight:600; letter-spacing:.02em; }
.study-done {
  display:flex; align-items:center; gap:7px; height:var(--desk-row-h); padding:0 6px; font-size:var(--font-13); color:var(--text-secondary);
}
.study-done .chk { background:var(--accent); border-color:var(--accent); }
.study-done .chk::after { content:''; width:6px; height:3px; border:1.5px solid #fff; border-top:0; border-right:0; transform:rotate(-45deg) translate(0,-1px); }

/* ── 下周窄列 ── */
.next {
  width:var(--desk-next-w); flex-shrink:0; border-left:1px solid var(--border-default); border-right:1px solid var(--border-default);
  background:var(--bg-panel); display:flex; flex-direction:column; transition:width .16s var(--ease); overflow:hidden;
}
body.dragging .next, .next:hover { width:var(--desk-next-open); }
:root { --desk-next-open:168px; }
.next-h { height:40px; display:flex; align-items:center; justify-content:center; gap:4px; font-size:var(--font-12); color:var(--text-secondary); border-bottom:1px solid var(--border-subtle); white-space:nowrap; flex-shrink:0; }
.next-h b { color:var(--text-primary); }
.next-h .full { display:none; }
.next-h .short { text-align:center; line-height:1.25; font-size:var(--font-11); }
body.dragging .next-h .short, .next:hover .next-h .short { display:none; }
body.dragging .next-h .full, .next:hover .next-h .full { display:inline; }
.next-cells { flex:1; display:flex; flex-direction:column; padding:6px 4px; gap:4px; }
.nc {
  flex:1; max-height:76px; border-radius:var(--radius-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:var(--font-11); color:var(--text-tertiary); border:1px dashed transparent; white-space:nowrap;
}
.nc .bar { width:14px; border-radius:2px; background:var(--border-default); }
.nc .lab-s { }
.nc .lab-l { display:none; }
body.dragging .nc, .next:hover .nc { flex-direction:row; justify-content:flex-start; padding:0 8px; gap:8px; border-color:var(--border-default); }
body.dragging .nc .lab-s, .next:hover .nc .lab-s { display:none; }
body.dragging .nc .lab-l, .next:hover .nc .lab-l { display:inline; }
.nc .lab-l b { color:var(--text-primary); font-weight:600; }
.nc.drop { background:var(--accent-soft); border-color:var(--accent); border-style:solid; color:var(--accent); }

/* ── 右栏 ── */
.rail { width:var(--desk-rail-w); flex-shrink:0; background:var(--bg-panel); display:flex; flex-direction:column; min-height:0; }
.rail-sec { display:flex; flex-direction:column; min-height:0; }
.rail-sec.fu { flex:1.3; border-bottom:1px solid var(--border-default); }
.rail-sec.inbox { flex:1; }
.rail-sec.drop { background:var(--accent-soft); }
.rail-h { height:40px; flex-shrink:0; display:flex; align-items:center; gap:8px; padding:0 14px; border-bottom:1px solid var(--border-subtle); font-size:var(--font-13); font-weight:600; }
.rail-h small { font-size:var(--font-11); color:var(--text-tertiary); font-weight:400; }
.rail-b { overflow-y:auto; padding:6px 8px 16px; }
.person { border-radius:var(--radius-sm); }
.ph { height:30px; display:flex; align-items:center; gap:8px; padding:0 6px; border-radius:var(--radius-sm); font-size:var(--font-13); cursor:pointer; }
.ph:hover { background:var(--row-hover); }
.ph .av { width:20px; height:20px; border-radius:50%; display:grid; place-items:center; font-size:var(--font-11); color:var(--text-on-accent); background:var(--c); flex-shrink:0; }
.ph .nm { font-weight:600; }
.ph .cnt { font-size:var(--font-11); color:var(--text-tertiary); }
.ph .old { font-size:var(--font-11); color:var(--warning); margin-left:auto; }
.ph .copy { font-size:var(--font-11); color:var(--text-tertiary); padding:1px 6px; border-radius:3px; border:1px solid var(--border-default); }
.ph .copy:hover { color:var(--accent); border-color:var(--accent); }
.person .rows { padding-left:22px; display:none; }
.person.open .rows { display:block; }
.mode { font-size:var(--font-11); padding:0 5px; border-radius:3px; background:var(--bg-subtle); color:var(--text-secondary); flex-shrink:0; }
.mode.d { background:color-mix(in srgb,var(--goal-6) 14%,transparent); color:var(--goal-6); }

/* ── 浮层：挪动条 / 菜单 / toast / 拖拽影子 ── */
.movebar {
  position:fixed; left:50%; bottom:20px; transform:translate(-50%,12px); opacity:0; pointer-events:none;
  display:flex; align-items:center; gap:4px; padding:6px; border-radius:var(--radius-lg);
  background:var(--bg-raised); border:1px solid var(--border-default); box-shadow:var(--shadow-lg); z-index:20;
  transition:opacity .14s var(--ease), transform .14s var(--ease);
}
.movebar.show { opacity:1; transform:translate(-50%,0); pointer-events:auto; }
.movebar .n { font-size:var(--font-12); color:var(--text-secondary); padding:0 8px 0 6px; white-space:nowrap; }
.movebar .sep { width:1px; height:18px; background:var(--border-default); margin:0 4px; }
.movebar button { font-size:var(--font-12); padding:4px 9px; border-radius:var(--radius-sm); color:var(--text-primary); white-space:nowrap; }
.movebar button:hover { background:var(--row-hover); }
.movebar button.go { color:var(--accent); font-weight:600; }
.movebar button.danger { color:var(--danger); }
.movebar kbd { margin-left:4px; }
.menu {
  position:fixed; z-index:30; min-width:200px; padding:4px; border-radius:var(--radius-md); background:var(--bg-raised);
  border:1px solid var(--border-default); box-shadow:var(--shadow-lg); display:none;
}
.menu.show { display:block; }
.menu button { display:flex; width:100%; justify-content:space-between; gap:16px; font-size:var(--font-12); padding:5px 8px; border-radius:var(--radius-sm); text-align:left; }
.menu button:hover { background:var(--row-hover); }
.menu .lbl { font-size:var(--font-11); color:var(--text-tertiary); padding:4px 8px 2px; }
.menu hr { border:0; border-top:1px solid var(--border-subtle); margin:4px 0; }
.toast {
  position:fixed; left:50%; bottom:76px; transform:translate(-50%,8px); opacity:0; z-index:40; pointer-events:none;
  display:flex; gap:12px; align-items:center; padding:8px 12px; border-radius:var(--radius-md); font-size:var(--font-13);

'use strict';
/* ═════════════ 日期工具（本地时区，YYYY-MM-DD 字符串为主） ═════════════ */
const TODAY = '2026-10-16';
const NOW_HOUR = 17; // 原型固定在周五 17 点之后 ⇒ 展示「本周收尾」

const toD = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };

const it = (o) => ({ id: 'i' + seq++, kind: 'todo', urgency: 0, scope: 'work', status: 'open', defer: 0, ...o });
const D = (n) => add(THIS_MON, n); // 本周一 + n 天

let S = initial();
let viewMon = THIS_MON;
let sel = new Set(); // 'i:<id>' | 'r:<id>@<date>'
let anchorKey = null;

/* ═════════════ 派生（W1 落到 src/lib/derive/desk.ts） ═════════════ */
const isWorkday = (d) => { const m = S.marks[d]; if (m) return m === 'work'; const w = dow(d); return w !== 0 && w !== 6; };
function lastWorkdayOfMonth(d) { const x = toD(d); let e = fmt(new Date(x.getFullYear(), x.getMonth() + 1, 0)); while (!isWorkday(e)) e = add(e, -1); return e; }

  if (r.scope === 'work' && !isWorkday(d)) return false;
  switch (r.rule.type) {
    case 'daily': return true;
    case 'workday': return isWorkday(d);
    case 'weekly': return r.rule.days.includes(dow(d));

  }

}
/** 某天出现的例行：命中规则且没被改走 + 改到这天的；今天额外挂本周漏做的周常（补做） */
function routinesOn(d) {
  const out = [];
  for (const r of S.routines) {
    const lg = S.logs[`${r.id}:${d}`];
    if (ruleHits(r, d) && !(lg && lg.status === 'moved')) out.push({ r, orig: d, status: lg?.status });
    for (const [k, v] of Object.entries(S.logs)) {
      if (v.status === 'moved' && v.movedTo === d && k.startsWith(r.id + ':')) out.push({ r, orig: k.split(':')[1], status: v.doneAt ? 'done' : undefined, moved: true });
    }
  }
  if (d === TODAY) {
    for (let x = THIS_MON; x < TODAY; x = add(x, 1)) {
      for (const r of S.routines) {
        if (r.rule.type !== 'weekly' || !ruleHits(r, x)) continue;
        const lg = S.logs[`${r.id}:${x}`];
        if (!lg) out.push({ r, orig: x, makeup: true });
        else if (lg.status === 'done' && lg.makeupOn === TODAY) out.push({ r, orig: x, makeup: true, status: 'done' });

const effUrg = (i) => { let u = i.urgency; if (i.due && i.status === 'open') { if (i.due < TODAY) u = 2; else if (diff(i.due, TODAY) <= 1) u = Math.max(u, 1); } return u; };
const byUrg = (a, b) => effUrg(b) - effUrg(a) || (a.due || 'z').localeCompare(b.due || 'z');
const openItems = () => S.items.filter((i) => i.status === 'open');
const todosOn = (d) => S.items.filter((i) => i.kind === 'todo' && i.date === d);
const rolledToToday = () => S.items.filter((i) => i.status === 'open' && i.date && i.date < TODAY);
const fuDueOn = (d) => S.items.filter((i) => i.kind === 'followup' && i.date === d);
function personGroups() {
  const g = new Map();
  for (const i of openItems().filter((x) => x.kind === 'followup')) { if (!g.has(i.person)) g.set(i.person, []); g.get(i.person).push(i); }
  return [...g.entries()].map(([p, list]) => ({ p, list: list.sort((a, b) => a.since.localeCompare(b.since)), oldest: diff(TODAY, list.reduce((m, x) => (x.since < m ? x.since : m), TODAY)) }))

}
function openCountOn(d) {
  return S.items.filter((i) => i.status === 'open' && i.date === d).length + routinesOn(d).filter((x) => !x.status).length;
}
const pickStudy = () => S.plan.filter((p) => p.study && !p.done)[S.study.pick % Math.max(1, S.plan.filter((p) => p.study && !p.done).length)];

/* ═════════════ 渲染 ═════════════ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const avColor = (p) => ['var(--goal-1)', 'var(--goal-6)', 'var(--goal-3)', 'var(--goal-2)'][[...p].reduce((a, c) => a + c.charCodeAt(0), 0) % 4];

function itemRow(i, { rolled = false, showDate = false, weekend = false } = {}) {
  const u = effUrg(i);
  const k = 'i:' + i.id;
  const cls = ['row', i.status === 'done' ? 'done' : '', i.status === 'open' && u ? 'u' + u : '', sel.has(k) ? 'sel' : ''];
  const stale = i.status === 'open' && (i.defer >= 3 || (rolled && diff(TODAY, i.date) >= 3));

}
function routineRow(x, d) {
  const k = `r:${x.r.id}@${x.orig}`;

}
function studyCard() {
  const st = S.study;

function commit(label, fn) {

const findItem = (id) => S.items.find((i) => i.id === id);
function keyDate(k) {
  if (k.startsWith('i:')) { const i = findItem(k.slice(2)); return i.date && i.date >= TODAY ? i.date : TODAY; }
  const [, rest] = k.split(':'); const [, orig] = rest.split('@'); const lg = S.logs[k.slice(2).replace('@', ':')];
  return lg?.movedTo || (orig < TODAY ? TODAY : orig);
}
/** 把一组 key 挪到 target(key) 算出的日期；null = 收件箱 */
function moveKeys(keys, target, label) {
  let late = 0;
  commit(label(keys.length), () => {
    for (const k of keys) {
      const to = target(k);
      if (k.startsWith('i:')) {
        const i = findItem(k.slice(2));
        if (to && i.date && to > i.date) i.defer = (i.defer || 0) + 1;
        if (to && i.due && to > i.due) late++;
        i.date = to;
      } else {
        const [rid, orig] = k.slice(2).split('@');
        if (!to) continue; // 例行不能进收件箱
        if (to === orig) delete S.logs[`${rid}:${orig}`];
        else S.logs[`${rid}:${orig}`] = { status: 'moved', movedTo: to };
      }
    }
    sel.clear();

}

function toggleKey(k, day) {

  } else {
    const [rid, orig] = k.slice(2).split('@');
    const key = `${rid}:${orig}`;

/* ═════════════ 快速添加解析（W1 = 纯函数 parseQuickAdd + vitest） ═════════════ */
const WD = { 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 日: 0, 天: 0 };
function dateWord(w) {
  if (w === '今天') return TODAY;
  if (w === '明天') return add(TODAY, 1);
  if (w === '后天') return add(TODAY, 2);
  let m = w.match(/^(下)?周([一二三四五六日天])$/);
  if (m) { const base = m[1] ? add(THIS_MON, 7) : THIS_MON; const t = add(base, (WD[m[2]] + 6) % 7); return !m[1] && t < TODAY ? add(t, 7) : t; }
  m = w.match(/^(\d{1,2})[./-](\d{1,2})$/);
  if (m) return `2026-${pad(+m[1])}-${pad(+m[2])}`;
  return null;
}
const DATE_RE = /(今天|明天|后天|下?周[一二三四五六日天]|\d{1,2}[./-]\d{1,2})/;
function parseQA(text) {
  let t = ' ' + text + ' ';
  const r = { urgency: 0, scope: null, date: undefined, due: null, person: null, mode: null, goal: null, routine: null };
  let m;
  if ((m = t.match(/\s(每天|工作日|每周([一二三四五六日天]+)|每月(\d{1,2})号|每月最后一天)\s/))) {
    r.routine = m[1] === '每天' ? { type: 'daily' } : m[1] === '工作日' ? { type: 'workday' } : m[2] ? { type: 'weekly', days: [...m[2]].map((c) => WD[c]) } : m[3] ? { type: 'monthDay', day: +m[3] } : { type: 'monthLastWorkday' };
    r.routineLabel = m[1]; t = t.replace(m[0], ' ');
  }
  if ((m = t.match(/\s(?:截止|ddl\s*)(今天|明天|后天|下?周[一二三四五六日天]|\d{1,2}[./-]\d{1,2})\s/i))) { r.due = dateWord(m[1]); t = t.replace(m[0], ' '); }
  if ((m = t.match(new RegExp('\\s' + DATE_RE.source + '\\s')))) { r.date = dateWord(m[1]); t = t.replace(m[0], ' '); }
  if ((m = t.match(/\s(!{1,2}|！{1,2})(?=\s|\S)/))) { r.urgency = m[1].length; t = t.replace(m[1], ''); }
  if ((m = t.match(/@(\S+)/))) { r.person = m[1]; t = t.replace(m[0], ''); }
  if ((m = t.match(/#(\S+)/))) { const g = Object.entries(GOALS).find(([, v]) => v.name.toLowerCase().startsWith(m[1].toLowerCase())); r.goal = g ? g[0] : null; t = t.replace(m[0], ''); }
  if ((m = t.match(/~(生活|工作)/))) { r.scope = m[1] === '生活' ? 'life' : 'work'; t = t.replace(m[0], ''); }
  r.title = t.replace(/\s+/g, ' ').trim();
  if (r.person) r.mode = /下发|发给|分派|派给/.test(r.title) ? 'dispatch' : 'inform';
  if (r.person) r.title = r.title.replace(/^(下发|发给|分派|派给|告知|通知)\s*/, '');
  if (!r.scope) r.scope = r.date && (dow(r.date) === 0 || dow(r.date) === 6) ? 'life' : 'work';
  return r;
}

      case 'copy-done': { const p = a.dataset.p; commit(`${p} 的 ${personGroups().find((x) => x.p === p).list.length} 件已标为完成`, () => S.items.forEach((i) => { if (i.kind === 'followup' && i.person === p && i.status === 'open') i.status = 'done'; })); return; }
      case 'undo': undo(); return;
      case 'daymenu': {
        e.stopPropagation();
        const d = a.dataset.day; const r = a.getBoundingClientRect();
        const left = S.items.filter((i) => i.status === 'open' && (i.date === d || (d === TODAY && i.date && i.date < TODAY))).length;
        showMenu(r.left, r.bottom + 4, `<div class="lbl">周${CN[dow(d)]} ${md(d)} 没做完的 ${left} 件</div>
          <button data-act="day-mv" data-how="tomorrow" data-day="${d}">→ 明天</button>
          <button data-act="day-mv" data-how="mon" data-day="${d}">→ 下周一</button>
          <button data-act="day-mv" data-how="same" data-day="${d}">→ 下周同一天</button>
          <button data-act="day-sel" data-day="${d}">全选这天没做完的 <span style="color:var(--text-tertiary)">再自选去处</span></button><hr/>
          <button data-act="mark" data-type="off" data-day="${d}">标为休息日 <span style="color:var(--text-tertiary)">工作例行不出现</span></button>
          <button data-act="mark" data-type="work" data-day="${d}">标为补班日 <span style="color:var(--text-tertiary)">工作例行照常</span></button>
          ${S.marks[d] ? `<button data-act="mark" data-type="" data-day="${d}">清除标记</button>` : ''}`);
        return;
      }
      case 'day-mv': case 'day-sel': {
        const d = a.dataset.day;
        const keys = [...S.items.filter((i) => i.status === 'open' && (i.date === d || (d === TODAY && i.date && i.date < TODAY))).map((i) => 'i:' + i.id),
          ...routinesOn(d).filter((x) => !x.status && !x.makeup).map((x) => `r:${x.r.id}@${x.orig}`)];
        hideMenu();
        if (act === 'day-sel') { sel = new Set(keys); render(); return; }
        const [fn, lb] = MV[a.dataset.how];
        moveKeys(keys, fn, lb); return;
      }
      case 'mark': { const d = a.dataset.day; const tp = a.dataset.type; hideMenu(); commit(tp ? `周${CN[dow(d)]}已标为${tp === 'off' ? '休息日' : '补班日'}` : '已清除标记', () => { if (tp) S.marks[d] = tp; else delete S.marks[d]; }); return; }
      case 'mv-tomorrow': case 'mv-mon': case 'mv-same': case 'mv-inbox': { const [fn, lb] = MV[act.slice(3)]; moveKeys([...sel], fn, lb); return; }
      case 'mv-pick': pickDate([...sel]); return;
      case 'mv-clear': sel.clear(); render(); return;
      case 'mv-done': { const keys = [...sel]; commit(`完成 ${keys.length} 件`, () => { keys.forEach((k2) => { if (k2.startsWith('i:')) findItem(k2.slice(2)).status = 'done'; else { const [rid, o] = k2.slice(2).split('@'); S.logs[`${rid}:${o}`] = { status: 'done' }; } }); sel.clear(); }); return; }
      case 'mv-drop': { const keys = [...sel].filter((x) => x.startsWith('i:')); commit(`不做了：${keys.length} 件`, () => { keys.forEach((k2) => (findItem(k2.slice(2)).status = 'dropped')); sel.clear(); }); return; }
      case 'mv-urg': { const r = a.getBoundingClientRect(); showMenu(r.left, r.top - 110, '<button data-act="urg" data-u="2">🔴 紧急 <kbd>1</kbd></button><button data-act="urg" data-u="1">🟠 尽快 <kbd>2</kbd></button><button data-act="urg" data-u="0">⚪ 普通 <kbd>3</kbd></button>'); e.stopPropagation(); return; }
      case 'urg': setUrg(+a.dataset.u); hideMenu(); return;
      case 'split': case 'later': case 'drop': {
        e.stopPropagation(); const i = findItem(k.slice(2));
        if (act === 'drop') commit(`不做了：${i.title}`, () => (i.status = 'dropped'));
        else if (act === 'later') { sel = new Set([k]); render(); toast('已选中，用下方挪动条改期'); }
        else { $('qa').value = i.title + '（一）'; $('qa').focus(); renderQAPreview(); toast('拆成小步：改好第一步回车，原条目可勾掉'); }
        return;
      }
      case 'study-start': case 'study-short': commit('', () => { S.study.state = 'running'; S.study.endAt = Date.now() + (act === 'study-short' ? 15 : 45) * 60e3; }); tick(); return;
      case 'study-finish': commit('已打卡并回写甘特图：SAP · MM 模块学习', () => { S.study.state = 'done'; const p = pickStudy(); if (p) p.done = true; }); return;
      case 'study-cancel': commit('', () => { S.study.state = 'idle'; }); return;
      case 'study-swap': commit('', () => { S.study.pick++; }); return;
      case 'close-mon': moveKeys(weekOpenItems().map((i) => 'i:' + i.id), MV.mon[0], (n) => `本周收尾：${n} 件挪到下周一`); return;
      case 'close-same': moveKeys(weekOpenItems().map((i) => 'i:' + i.id), MV.same[0], (n) => `本周收尾：${n} 件按原星期挪到下周`); return;
      case 'close-each': eachSheet(); return;
      case 'each-next': case 'each-inbox': case 'each-drop': {
        const i = findItem(a.dataset.id);
        commit('', () => { if (act === 'each-drop') i.status = 'dropped'; else { const to = act === 'each-next' ? sameNextWeek(i.date < TODAY ? TODAY : i.date) : null; if (to) i.defer++; i.date = to; } });
        eachSheet(); return;
      }
      case 'sheet-close': closeSheet(); return;
    }
  }
  // 行点击：选择
  const row = e.target.closest('.row[data-key]');
  if (row) {
    const k = row.dataset.key;
    if (e.shiftKey && anchorKey) {
      const vk = visibleKeys(); const a1 = vk.indexOf(anchorKey), b1 = vk.indexOf(k);
      if (a1 >= 0 && b1 >= 0) { const [s, t] = a1 < b1 ? [a1, b1] : [b1, a1]; vk.slice(s, t + 1).forEach((x) => sel.add(x)); }
    } else if (e.ctrlKey || e.metaKey) { sel.has(k) ? sel.delete(k) : sel.add(k); anchorKey = k; }
    else { sel = sel.size === 1 && sel.has(k) ? new Set() : new Set([k]); anchorKey = k; }
    render(); return;
  }
  if (!e.target.closest('.movebar, .menu, .toast, .sheet-card') && sel.size) { sel.clear(); render(); }
});
$('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });

function setUrg(u) { const keys = [...sel].filter((x) => x.startsWith('i:')); if (!keys.length) return; commit(`紧急度改为${['普通', '尽快', '紧急'][u]}：${keys.length} 件`, () => keys.forEach((k) => (findItem(k.slice(2)).urgency = u))); }
function pickDate(keys) {
  if (!keys.length) return;
  const dp = $('datePick');
  dp.value = add(TODAY, 7);
  dp.onchange = () => { if (dp.value) moveKeys(keys, () => dp.value, (n) => `挪到 ${md(dp.value)}：${n} 件`); };
  try { dp.showPicker(); } catch { dp.click(); }
}

/* 键盘 */
document.addEventListener('keydown', (e) => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { if (typing) return; e.preventDefault(); undo(); return; }
  if (typing) {
    if (e.key === 'Enter' && e.target.id === 'qa') submitQA();
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  const k = e.key;
  if (k === 'Escape') { sel.clear(); hideMenu(); closeSheet(); render(); return; }
  if (k === 'n' || k === 'N') { e.preventDefault(); $('qa').focus(); return; }
  if (k === 't' || k === 'T') { viewMon = THIS_MON; render(); return; }
  if (k === 's' || k === 'S') { if (S.study.state === 'idle') { commit('', () => { S.study.state = 'running'; S.study.endAt = Date.now() + 45 * 60e3; }); tick(); } return; }
  if (e.shiftKey && k === 'ArrowRight' && sel.size) { e.preventDefault(); moveKeys([...sel], ...MV.tomorrow); return; }
  if (e.shiftKey && (k === 'W' || k === 'w') && sel.size) { moveKeys([...sel], ...MV.same); return; }
  if (e.shiftKey && (k === 'M' || k === 'm') && sel.size) { moveKeys([...sel], ...MV.mon); return; }
  if (k === 'ArrowLeft') { viewMon = add(viewMon, -7); render(); return; }
  if (k === 'ArrowRight') { viewMon = add(viewMon, 7); render(); return; }
  if ((k === 'x' || k === 'X') && sel.size) { $('movebar').querySelector('[data-act="mv-done"]').click(); return; }
  if ((k === 'd' || k === 'D') && sel.size) { pickDate([...sel]); return; }
  if (['1', '2', '3'].includes(k) && sel.size) { setUrg({ 1: 2, 2: 1, 3: 0 }[k]); return; }
});

/* 拖拽：原生 pointer events，3px 起拖；多选时带走全部选中 */
let drag = null, dragJustEnded = false, flipTimer = null;
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || e.target.closest('button')) return;
  const row = e.target.closest('.row[data-key]');
  if (!row || e.shiftKey || e.ctrlKey || e.metaKey) return;
  drag = { key: row.dataset.key, x: e.clientX, y: e.clientY, on: false, row };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 3) return;
    drag.on = true;
    drag.keys = sel.has(drag.key) ? [...sel] : [drag.key];
    document.body.classList.add('dragging');
    document.querySelectorAll('.row[data-key]').forEach((r) => { if (drag.keys.includes(r.dataset.key)) r.classList.add('ghosted'); });
    const g = document.createElement('div');
    g.className = 'ghost';
    g.innerHTML = `${drag.keys.length > 1 ? drag.keys.length + ' 件' : esc(drag.row.querySelector('.t').textContent)}<span class="tip"></span>`;
    document.body.appendChild(g); drag.ghost = g;
  }
  drag.ghost.style.transform = `translate(${e.clientX + 12}px, ${e.clientY + 10}px)`;
  document.querySelectorAll('.drop').forEach((x) => x.classList.remove('drop'));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  let tip = '';
  drag.target = undefined;
  const nc = el?.closest('[data-next]'), nh = el?.closest('[data-next-head]'), col = el?.closest('.col[data-day]'), rail = el?.closest('[data-drop="inbox"]');
  const arrow = el?.closest('#nextW, #prevW');
  if (nc) { nc.classList.add('drop'); drag.target = nc.dataset.next; tip = `→ 下周${CN[dow(drag.target)]} ${md(drag.target)}`; }
  else if (nh) { drag.target = 'same'; tip = '→ 下周同一天'; }
  else if (col) { col.classList.add('drop'); drag.target = col.dataset.day; tip = `→ 周${CN[dow(drag.target)]} ${md(drag.target)}`; }
  else if (rail) { rail.classList.add('drop'); drag.target = null; tip = '→ 收件箱'; }
  drag.ghost.querySelector('.tip').textContent = tip;
  if (arrow) {
    arrow.classList.add('hot');
    if (!flipTimer) flipTimer = setTimeout(() => { viewMon = add(viewMon, arrow.id === 'nextW' ? 7 : -7); flipTimer = null; render(); document.body.classList.add('dragging'); document.querySelector('#nextW,#prevW') && arrow.classList.add('hot'); }, 600);
  } else { clearTimeout(flipTimer); flipTimer = null; document.querySelectorAll('.arrow.hot').forEach((x) => x.classList.remove('hot')); }
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  clearTimeout(flipTimer); flipTimer = null;
  if (!d.on) return;
  d.ghost.remove();
  document.body.classList.remove('dragging');
  document.querySelectorAll('.drop, .ghosted, .arrow.hot').forEach((x) => x.classList.remove('drop', 'ghosted', 'hot'));
  dragJustEnded = true; setTimeout(() => (dragJustEnded = false), 0);
  if (d.target === undefined) return render();
  if (d.target === 'same') return moveKeys(d.keys, MV.same[0], MV.same[1]);
  moveKeys(d.keys, () => d.target, (n) => (d.target ? `挪到周${CN[dow(d.target)]} ${md(d.target)}：${n} 件` : `放回收件箱：${n} 件`));
});

/* 学习计时（原型里真倒计时，只更新那一个节点） */
let tickTimer;
function tick() {
  clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    const el = document.getElementById('timer');
    if (S.study.state !== 'running') return clearInterval(tickTimer);
    if (!el) return;
    const ms = Math.max(0, S.study.endAt - Date.now());
    el.textContent = `${pad(Math.floor(ms / 60e3))}:${pad(Math.floor((ms % 60e3) / 1e3))}`;
  }, 250);
}

/* 主题：默认跟随系统，按钮切换 */
const mq = matchMedia('(prefers-color-scheme: dark)');
let theme = mq.matches ? 'dark' : 'light';
function applyTheme() { document.documentElement.dataset.theme = theme; $('themeBtn').textContent = `主题：${theme === 'dark' ? '深色' : '浅色'}`; }
$('themeBtn').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; applyTheme(); };
const qs = new URLSearchParams(location.search);
if (qs.get('theme')) theme = qs.get('theme');
applyTheme();

$('prevW').onclick = () => { viewMon = add(viewMon, -7); render(); };
$('nextW').onclick = () => { viewMon = add(viewMon, 7); render(); };
$('thisW').onclick = () => { viewMon = THIS_MON; render(); };
$('qa').addEventListener('input', renderQAPreview);
renderQAPreview();
render();
</script>
</body>
</html>
